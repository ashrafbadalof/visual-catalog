seed: 42
data_root: data

paths:
  styles_csv: styles.csv
  images_dir: images_256
  processed_dir: processed
  cache_dir: cache/teacher
  catalog_db: catalog.db
  checkpoints_dir: checkpoints
  features_dir: cache/student_features

teacher:
  arch: ViT-L-14
  pretrained: laion2b_s32b_b82k
  batch_size: 32
  num_workers: 4
  prompts:
    - "a photo of a {}."
    - "a product photo of a {}."
    - "a studio photo of a {}, isolated on a white background."

student:
  run_name: mnv3l_cos_e20
  arch: mobilenet_v3_large
  epochs: 20
  batch_size: 32
  lr: 3.0e-4
  num_workers: 4
  rel_weight: 0
  rel_tau: 0.1

head:
  student_run: mnv3l_cos_e20
  temperatures: [1.0, 2.0, 4.0]
  budgets: [100, 300, 1000, 3000, 10000, 40000]
  human_per_class: [10, 25, 50]
  seeds: 3
  steps: 2000

cascade:
  student_run: mnv3l_cos_e20
  head_T: 4.0
  student_ms: 19.7
  teacher_ms: 1240
  threshold: 0.656

labels:
  column: articleType
  min_images: 100
  merge:
    Kurtis: Kurtas
    Tunics: Kurtas
    Flats: Sandals

splits:
  val: 0.05
  test: 0.15