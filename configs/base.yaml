seed: 42
data_root: data

paths:
  styles_csv: styles.csv
  images_dir: images_256
  processed_dir: processed
  cache_dir: cache/teacher

teacher:
  arch: ViT-L-14
  pretrained: laion2b_s32b_b82k
  batch_size: 32
  num_workers: 4
  prompts:
    - "a photo of a {}."
    - "a product photo of a {}."
    - "a studio photo of a {}, isolated on a white background."

labels:
  column: articleType
  min_images: 100

splits:
  val: 0.05
  test: 0.15